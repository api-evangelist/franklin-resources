apis:
  - aid: franklin-resources-detailed-product-apis
    name: Franklin Templeton Detailed Product APIs
    description: >-
      Seven read-only GET operations over Franklin Templeton global fund data — fund reference
      details, investment team, current NAV, NAV history, distribution rate, distribution history
      and product AUM. Every operation is addressed by a FundKey value plus a FundType namespace,
      where the namespace may be an industry securities identifier (ISIN, CUSIP, SEDOL, WKN,
      Valoren, CIC) or a vendor symbol (Bloomberg, Lipper, Reuters, ticker). RETIRED: the base host
      api.franklintempleton.com has no DNS A record as of 2026-09-10 and the developer portal that
      fronted it is archived only. The contract remains publicly served from Franklin Templeton's
      own SwaggerHub organization.
