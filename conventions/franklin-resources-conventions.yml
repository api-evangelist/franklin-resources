summary: >-
  A read-only, seven-operation fund-data API. Every operation is a GET, every operation takes the
  same four header/query parameters, and there is no mutating surface anywhere in the contract.
  That single fact settles most of the runtime-semantics questions below as `na` rather than zero.
auth_style:
  style: bearer-token-header
  header: Authorization
  declared_as_security_scheme: false
  detail: authentication/franklin-resources-authentication.yml
content_negotiation:
  request_header: Accept
  required: true
  spec_default: application/json
  supported:
    - application/json
    - application/xml
  note: >-
    Unusually, `Accept` is modelled as a REQUIRED parameter rather than an optional negotiation
    header, so a client that omits it is out of contract. XML and JSON are both first-class.
resource_identification:
  pattern: >-
    Every operation takes `FundKey` + `FundType`, where `FundType` names the identifier NAMESPACE
    and `FundKey` carries the value. This is a genuine domain convention worth recording: the API
    accepts industry identifiers directly rather than forcing a vendor-specific id.
  identifier_namespaces:
    - ALL
    - FT_FUND_KEY
    - MEXID
    - BLOOMBERG_IDENTIFIER
    - LIPPER_IDENTIFIER
    - ISIN
    - CUSIP
    - SEDOL
    - REUTERS_SYMBOL
    - WKN
    - VALEREN_SYMBOL
    - TICKER
    - Fund_CIC
  note: ISIN, CUSIP and SEDOL are the ISO/ANSI/national securities identifiers — see conformance/.
date_range_filtering:
  params:
    - FromDate
    - ToDate
  applies_to:
    - GetNAVHistory
    - GetDistributionHistory
  format_documented: false
  note: The contract does not state a date format for FromDate/ToDate. That is a real gap.
pagination:
