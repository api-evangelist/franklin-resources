aid: franklin-resources
name: Franklin Resources
description: >-
  Franklin Resources, doing business as Franklin Templeton, is a global investment management
  organization offering investment management and related services to retail, institutional, and
  high net worth clients. It ran a public developer program — the "Detailed Product APIs", seven
  read-only fund reference, NAV, distribution and AUM operations at api.franklintempleton.com/v1,
  fronted by a portal at developer.franklintempleton.com — and retired it without a published
  deprecation notice. Both hosts now have no DNS record; the Swagger 2.0 contract is still served
  publicly from Franklin Templeton's own SwaggerHub organization, and the company publishes a
  first-party llms.txt on its main site.
