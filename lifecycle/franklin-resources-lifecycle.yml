observations:
  - >-
    This is a Fortune 500 asset manager that shipped a public fund-data API, took it down, and left
    the contract discoverable on its own SwaggerHub organization. Anyone integrating from that
    contract today would get DNS failure, not a deprecation error.
  - >-
    The llms.txt Franklin Templeton publishes at https://www.franklintempleton.com/llms.txt is a
    genuine first-party document (7,368 bytes, text/plain, fetched 2026-09-10) but it advertises
    dead routes: of 40 franklintempleton.com links sampled from it, 5 return the site's 11,907-byte
    soft-404 shell (/investments/additional-capabilities, /investments/capabilities/etfs, and three
    /planning-and-learning/learn-about-investing/market-volatility* pages). The published sitemap
    has the same problem — every /insights/best-ideas* URL in us-retail_staticsitemap.xml returns
    the soft-404 shell. An agent following either document lands on nothing.
  - >-
    NO Agent Skill is generated for this provider, deliberately. Skills would be grounded in real
    operationIds from a real first-party contract, but they would instruct an agent to call
    api.franklintempleton.com — a host with no DNS record. Publishing them would teach agents to
    call an API that cannot be reached. No skills/ artifact and no AgentSkill pointer are written.
  - >-
    robots.txt on www.franklintempleton.com disallows `/llm.txt` (singular) while the file the site
    actually serves is `/llms.txt` (plural), which is not disallowed. Probably a typo; recorded
    because it is the only AI-facing directive the company publishes.
