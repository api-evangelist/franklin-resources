        default: Bearer <Access_Token>
      - name: Accept
        in: header
        description: application/xml or application/json
        required: true
        type: string
        default: application/json
      - name: FundKey
        in: query
        description: FundKey can be any of the following - Leave the value as blank if passing FundType
          as "ALL", FT_FUND_KEY, MEXID, BLOOMBERG_IDENTIFIER, LIPPER_IDENTIFIER, ISIN, CUSIP, SEDOL, REUTERS_SYMBOL,
          WKN, VALEREN_SYMBOL, TICKER, Fund_CIC
        required: true
        type: string
        default: US8802081039
      - name: FundType
        in: query
        description: FundKey can be any of the following with value associated to FundType - ALL, FT_FUND_KEY,
          MEXID, BLOOMBERG_IDENTIFIER, LIPPER_IDENTIFIER, ISIN, CUSIP, SEDOL, REUTERS_SYMBOL, WKN, VALEREN_SYMBOL,
