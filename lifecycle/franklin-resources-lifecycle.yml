headline: >-
  Franklin Templeton ran a real public developer program — a Drupal-style portal at
  developer.franklintempleton.com fronting the "Detailed Product APIs" (7 read-only fund-data
  operations) at https://api.franklintempleton.com/v1 — and RETIRED it without publishing a
  deprecation notice, a sunset date, or a migration path. Both hosts now have no DNS record.
  The only surviving machine-readable trace is the company's own SwaggerHub organization, which
  still serves the Swagger 2.0 contract publicly today.
